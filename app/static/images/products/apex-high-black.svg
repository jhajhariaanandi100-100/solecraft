<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <filter id="dropShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#000000" flood-opacity="0.14" />
    </filter>
    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.18" />
    </filter>
    <linearGradient id="soleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#222222" />
      <stop offset="100%" stop-color="#E0E0DC" />
    </linearGradient>
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAFAF9" />
      <stop offset="100%" stop-color="#EFEFEA" />
    </linearGradient>
  </defs>

  <!-- Clean Canvas Background -->
  <rect width="600" height="400" rx="16" fill="url(#bgGlow)"/>

  <!-- Floor Contact Shadow -->
  <ellipse cx="300" cy="340" rx="220" ry="20" fill="#111111" opacity="0.12" filter="blur(8px)" />

  <!-- Shoe Group with shadow -->
  <g filter="url(#dropShadow)">
    <!-- Sole / Outsole & Midsole -->
    <path d="M 80 290 L 510 290 C 515 315, 490 330, 440 330 L 100 330 C 80 330, 75 310, 80 290 Z" fill="url(#soleGrad)" stroke="#D4D4CF" stroke-width="1.5" />
    <!-- Tread grooves -->
    <line x1="120" y1="322" x2="470" y2="322" stroke="#B8B8B0" stroke-width="2" stroke-dasharray="12 8" opacity="0.6" />

    <!-- Main Upper -->
    <path d="M 90 280 L 110 150 C 120 120, 160 110, 190 120 L 250 140 C 270 170, 310 210, 360 230 L 440 240 C 470 250, 490 270, 500 290 L 90 290 Z" fill="#111111" stroke="#CCCCCC" stroke-width="1" />

    <!-- Overlay Quarter / Heel Counter -->
    <path d="M 95 275 C 90 220, 130 180, 180 180 L 195 275 Z" fill="#1E1E24" opacity="0.9" />

    <!-- Collar / Lining -->
    <path d="M 110 150 C 130 110, 190 100, 240 120 L 230 170 C 180 150, 130 160, 110 150 Z" fill="#222222" />

    <!-- Signature Brand Swoosh / Vector Wave -->
    <path d="M 160 210 Q 280 180, 380 255 Q 310 250, 210 260 Z" fill="#FF6B35" filter="url(#softShadow)" />

    <!-- Heel Tab / Pull Accent -->
    <rect x="85" y="210" width="12" height="40" rx="6" fill="#FF6B35" />

    <!-- Eyestay & Laces -->
    <line x1="230" y1="150" x2="248" y2="158" stroke="#FF6B35" stroke-width="4.5" stroke-linecap="round" filter="url(#dropShadow)" />
<line x1="250" y1="175" x2="268" y2="183" stroke="#FF6B35" stroke-width="4.5" stroke-linecap="round" filter="url(#dropShadow)" />
<line x1="275" y1="200" x2="293" y2="208" stroke="#FF6B35" stroke-width="4.5" stroke-linecap="round" filter="url(#dropShadow)" />
<line x1="305" y1="220" x2="323" y2="228" stroke="#FF6B35" stroke-width="4.5" stroke-linecap="round" filter="url(#dropShadow)" />
<line x1="335" y1="240" x2="353" y2="248" stroke="#FF6B35" stroke-width="4.5" stroke-linecap="round" filter="url(#dropShadow)" />


    <!-- Contrast Stitching Details -->
    <path d="M 120 270 C 130 200, 180 190, 240 195" fill="none" stroke="#FF6B35" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.75" />
    <path d="M 330 205 C 390 220, 440 245, 480 270" fill="none" stroke="#FFFFFF" stroke-width="1.2" stroke-dasharray="4 3" opacity="0.5" />

    <!-- Monogram Badge -->
    <g transform="translate(130, 245)">
      <circle cx="12" cy="12" r="10" fill="#111111" opacity="0.8" />
      <text x="12" y="16" font-family="'Inter', sans-serif" font-size="8" font-weight="900" fill="#FFFFFF" text-anchor="middle">SC</text>
    </g>
  </g>
</svg>