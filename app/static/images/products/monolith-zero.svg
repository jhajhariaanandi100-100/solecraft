<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <filter id="dropShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#000000" flood-opacity="0.14" />
    </filter>
    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.18" />
    </filter>
    <linearGradient id="soleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F4F1DE" />
      <stop offset="100%" stop-color="#E0E0DC" />
    </linearGradient>
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAFAF9" />
      <stop offset="100%" stop-color="#EFEFEA" />
    </linearGradient>
  </defs>

  <!-- Clean Canvas Background -->
  <rect width="600" height="400" rx="16" fill="url(#bgGlow)"/>

  <!-- Floor Contact Shadow -->
  <ellipse cx="300" cy="340" rx="220" ry="20" fill="#111111" opacity="0.12" filter="blur(8px)" />

  <!-- Shoe Group with shadow -->
  <g filter="url(#dropShadow)">
    <!-- Sole / Outsole & Midsole -->
    <path d="M 80 275 L 515 275 C 518 305, 480 330, 440 330 L 100 330 C 80 330, 75 305, 80 275 Z" fill="url(#soleGrad)" stroke="#D4D4CF" stroke-width="1.5" />
    <!-- Tread grooves -->
    <line x1="120" y1="322" x2="470" y2="322" stroke="#B8B8B0" stroke-width="2" stroke-dasharray="12 8" opacity="0.6" />

    <!-- Main Upper -->
    <path d="M 95 275 C 110 190, 175 170, 240 180 L 330 195 C 400 215, 460 240, 505 275 L 95 275 Z" fill="#EDE8F5" stroke="#CCCCCC" stroke-width="1" />

    <!-- Overlay Quarter / Heel Counter -->
    <path d="M 95 275 C 90 220, 130 180, 180 180 L 195 275 Z" fill="#3D3A45" opacity="0.9" />

    <!-- Collar / Lining -->
    <path d="M 140 180 C 170 155, 225 155, 250 180 Z" fill="#222222" />

    <!-- Signature Brand Swoosh / Vector Wave -->
    <path d="M 170 225 Q 300 190, 420 250 Q 330 245, 220 255 Z" fill="#70A9A1" filter="url(#softShadow)" />

    <!-- Heel Tab / Pull Accent -->
    <rect x="85" y="210" width="12" height="40" rx="6" fill="#70A9A1" />

    <!-- Eyestay & Laces -->
    <line x1="230" y1="185" x2="248" y2="193" stroke="#70A9A1" stroke-width="4.5" stroke-linecap="round" filter="url(#dropShadow)" />
<line x1="260" y1="200" x2="278" y2="208" stroke="#70A9A1" stroke-width="4.5" stroke-linecap="round" filter="url(#dropShadow)" />
<line x1="290" y1="215" x2="308" y2="223" stroke="#70A9A1" stroke-width="4.5" stroke-linecap="round" filter="url(#dropShadow)" />
<line x1="320" y1="230" x2="338" y2="238" stroke="#70A9A1" stroke-width="4.5" stroke-linecap="round" filter="url(#dropShadow)" />
<line x1="350" y1="245" x2="368" y2="253" stroke="#70A9A1" stroke-width="4.5" stroke-linecap="round" filter="url(#dropShadow)" />


    <!-- Contrast Stitching Details -->
    <path d="M 120 270 C 130 200, 180 190, 240 195" fill="none" stroke="#70A9A1" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.75" />
    <path d="M 330 205 C 390 220, 440 245, 480 270" fill="none" stroke="#FFFFFF" stroke-width="1.2" stroke-dasharray="4 3" opacity="0.5" />

    <!-- Monogram Badge -->
    <g transform="translate(130, 245)">
      <circle cx="12" cy="12" r="10" fill="#111111" opacity="0.8" />
      <text x="12" y="16" font-family="'Inter', sans-serif" font-size="8" font-weight="900" fill="#FFFFFF" text-anchor="middle">SC</text>
    </g>
  </g>
</svg>